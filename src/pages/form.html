<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <link rel="stylesheet" href="../styles/form.css">
    <link rel="stylesheet" href="../styles/main.css">
    <script type="module" src="../scripts/form.js"></script>
</head>

<body dir="rtl">
    <div class="container">
        <form id="player-form">
            <label for="player-name">Name:</label>
            <input type="text" id="player-name" name="player-name" required />
            <label for="player-phone">pone-number:</label>
            <input type="text" id="player-phone" name="player-phone" required />
            <label for="player-email">email:</label>
            <input type="email" id="player-email" name="player-email" required />
            <div class="c-btn">
                <button class="btn" type="submit">Continue</button>
                <button class="btn" type="reset">reset</button>
            </div>
        </form>

    </div>

</body>

</html>
